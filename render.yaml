# Render Blueprint: BE (Flask + PostgreSQL). Hướng dẫn: docs/deploy-vercel-render.md
services:
  - type: web
    name: anvietresource
    runtime: python
    plan: 1c-2g
    region: singapore
    branch: main
    buildCommand: pip install -r BE/requirements.txt
    preDeployCommand: cd BE && flask --app app db upgrade
    startCommand: gunicorn --chdir BE --workers 1 --threads 2 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: anvietresource-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_VISION_MODEL
        value: gpt-6-luna
      # https://<domain-vercel>,https://anvietresource.onrender.com (không có / cuối)
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LOCAL_ONLY
        value: "false"
      - key: SESSION_COOKIE_SECURE
        value: "true"

databases:
  - name: anvietresource-db
    databaseName: anvietresource
    user: anvietresource
    plan: 0.5c-1g
    diskSizeGB: 5
    region: singapore
